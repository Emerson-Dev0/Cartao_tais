<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe2">
  <title>Um presente para Taís ✦</title>

  <style>
    :root {
      --cream: #f6efe2;
      --paper: #fffaf0;
      --ink: #30251f;
      --muted: #78675a;
      --gold: #b58a45;
      --gold-light: #e6c989;
      --rose: #bd7f83;
      --rose-dark: #8f5059;
      --shadow: rgba(63, 43, 28, .16);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px calc(24px + env(safe-area-inset-bottom));
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 12%, rgba(230,201,137,.25), transparent 32%),
        radial-gradient(ellipse at 88% 82%, rgba(189,127,131,.16), transparent 30%),
        var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .page {
      width: min(100%, 760px);
      position: relative;
      isolation: isolate;
    }

    .frame {
      position: relative;
      padding: clamp(24px, 6vw, 52px);
      border: 1px solid rgba(181,138,69,.72);
      outline: 1px solid rgba(181,138,69,.28);
      outline-offset: 6px;
      background: rgba(255,250,240,.92);
      box-shadow: 0 24px 70px var(--shadow);
      text-align: center;
      overflow: hidden;
    }

    .frame::before, .frame::after {
      content: "✦";
      position: absolute;
      color: var(--gold);
      font-size: 22px;
      opacity: .8;
      pointer-events: none;
    }

    .frame::before { top: 15px; left: 17px; }
    .frame::after { bottom: 15px; right: 17px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .24em;
      font: 600 10px/1.5 Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: normal;
      line-height: 1.06;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 15px auto 0;
      max-width: 390px;
      color: var(--muted);
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.65;
    }

    .gold-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px auto;
      color: var(--gold);
      font-size: 12px;
    }

    .gold-line::before, .gold-line::after {
      content: "";
      width: min(19vw, 72px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .gold-line::after { transform: rotate(180deg); }

    /* Presente */
    .gift-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 230px;
      margin: 5px auto 15px;
      perspective: 800px;
    }

    .gift-button {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
      transition: transform .25s ease;
    }

    .gift-button:hover { transform: translateY(-5px) scale(1.025); }

    .gift-button:focus-visible, .action:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 5px;
    }

    .gift {
      position: relative;
      width: 142px;
      height: 126px;
      margin-top: 34px;
      filter: drop-shadow(0 12px 8px rgba(67,41,24,.16));
      animation: giftFloat 2.6s ease-in-out infinite;
    }

    .gift-box {
      position: absolute;
      width: 142px;
      height: 90px;
      bottom: 0;
      left: 0;
      border: 2px solid #8e6334;
      background: linear-gradient(135deg, #d6a95d, #b47c39);
      border-radius: 3px;
      overflow: hidden;
    }

    .gift-box::after {
      content: "";
      position: absolute;
      width: 23px;
      height: 100%;
      left: 58px;
      top: 0;
      background: #f6e3ad;
      box-shadow: inset 2px 0 rgba(255,255,255,.25),
                  inset -2px 0 rgba(119,74,28,.16);
    }

    .gift-lid {
      position: absolute;
      width: 158px;
      height: 27px;
      bottom: 82px;
      left: -8px;
      border: 2px solid #8e6334;
      border-radius: 4px;
      background: linear-gradient(135deg, #e7c47b, #c3914a);
      transform-origin: 12% 100%;
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
      z-index: 2;
    }

    .gift-lid::after {
      content: "";
      position: absolute;
      width: 23px;
      height: 100%;
      left: 66px;
      top: 0;
      background: #fff0c9;
    }

    .bow {
      position: absolute;
      width: 31px;
      height: 22px;
      left: 55px;
      top: -19px;
      z-index: 3;
    }

    .bow::before, .bow::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 15px;
      border: 4px solid #9c5c60;
      border-radius: 80% 80% 15% 80%;
      top: 0;
    }

    .bow::before { left: -7px; transform: rotate(25deg); }
    .bow::after { right: -7px; transform: scaleX(-1) rotate(25deg); }

    .sparkle {
      position: absolute;
      color: var(--gold);
      font-size: 22px;
      animation: twinkle 1.7s ease-in-out infinite;
      pointer-events: none;
    }

    .s1 { left: 15%; top: 23%; }
    .s2 { right: 16%; top: 14%; animation-delay: .5s; }
    .s3 { right: 20%; bottom: 14%; animation-delay: .9s; font-size: 15px; }
    .s4 { left: 20%; bottom: 17%; animation-delay: .25s; font-size: 16px; }

    .hint {
      margin: 0;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .opened .gift { animation: none; }
    .opened .gift-lid { transform: rotate(-125deg) translate(-10px, -13px); }
    .opened .gift-button:hover { transform: none; }
    .opened .gift-button { cursor: default; }

    /* Carta */
    .message {
      display: none;
      max-width: 540px;
      margin: 26px auto 0;
      animation: reveal .8s both;
    }

    .opened .message { display: block; }

    .message h2 {
      font-weight: normal;
      font-size: clamp(1.7rem, 6vw, 2.7rem);
      color: var(--rose-dark);
      margin: 0 0 22px;
    }

    .message p {
      color: #5d4b40;
      font-size: clamp(15px, 3.6vw, 18px);
      line-height: 1.8;
      margin: 0 0 16px;
      overflow-wrap: break-word;
    }

    .signature {
      color: var(--gold) !important;
      font-style: italic;
      margin-top: 24px !important;
    }

    /* Gatinhos pixel art */
    .cat-cluster {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(12px, 4vw, 30px);
      margin: 20px auto 26px;
      padding: 5px 0 12px;
    }

    .cat {
      --fur: #e6a36d;
      --dark: #754a37;
      --inner-ear: #d58e91;
      --cat-scale: 1;
      --cat-tilt: 0deg;
      --idle-time: 2.1s;
      --paw-time: .72s;
      --delay: 0s;

      position: relative;
      flex: 0 0 48px;
      width: 48px;
      height: 63px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      image-rendering: pixelated;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      animation: catIdle var(--idle-time) ease-in-out var(--delay) infinite;
      transform-origin: center bottom;
    }

    .cat:focus-visible {
      outline: 2px dashed var(--gold);
      outline-offset: 5px;
      border-radius: 5px;
    }

    .cat:hover { filter: drop-shadow(0 4px 3px rgba(63,43,28,.18)); }

    .cat .ear {
      position: absolute;
      top: 1px;
      width: 14px;
      height: 17px;
      background: var(--fur);
      border: 3px solid var(--dark);
      z-index: 1;
    }

    .cat .ear.left {
      left: 5px;
      clip-path: polygon(0 0,100% 28%,100% 100%,0 100%);
    }

    .cat .ear.right {
      right: 5px;
      clip-path: polygon(0 28%,100% 0,100% 100%,0 100%);
    }

    .cat .ear::after {
      content: "";
      position: absolute;
      inset: 3px 2px 2px;
      background: var(--inner-ear);
    }

    .cat .head {
      position: absolute;
      top: 11px;
      left: 5px;
      width: 38px;
      height: 28px;
      background: var(--fur);
      border: 3px solid var(--dark);
      border-radius: 2px 2px 5px 5px;
      z-index: 2;
    }

    .cat .eye {
      position: absolute;
      top: 7px;
      left: 5px;
      width: 4px;
      height: 6px;
      background: #30251f;
      box-shadow: 15px 0 #30251f;
    }

    .cat .eye::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 1px;
      height: 2px;
      background: white;
      box-shadow: 15px 0 white;
    }

    .cat .blush {
      position: absolute;
      left: 1px;
      bottom: 3px;
      width: 6px;
      height: 3px;
      background: #d98d91;
      box-shadow: 22px 0 #d98d91;
    }

    .cat .nose {
      position: absolute;
      top: 20px;
      left: 15px;
      width: 5px;
      height: 4px;
      background: #a65c69;
      clip-path: polygon(0 0,100% 0,50% 100%);
    }

    .cat .mouth {
      position: absolute;
      top: 24px;
      left: 16px;
      width: 4px;
      height: 3px;
      border-bottom: 1px solid var(--dark);
      border-left: 1px solid var(--dark);
    }

    .cat .body {
      position: absolute;
      top: 37px;
      left: 12px;
      width: 25px;
      height: 19px;
      background: var(--fur);
      border: 3px solid var(--dark);
      border-radius: 3px 3px 1px 1px;
      z-index: 1;
    }

    .cat .paw {
      position: absolute;
      top: 49px;
      width: 10px;
      height: 10px;
      background: var(--fur);
      border: 3px solid var(--dark);
      border-radius: 2px;
      z-index: 3;
      transform-origin: 50% 0%;
      animation: pawWave var(--paw-time) ease-in-out var(--delay) infinite;
    }

    .cat .paw.left { left: 10px; }
    .cat .paw.right { right: 7px; }

    .cat .tail {
      position: absolute;
      top: 35px;
      right: 0;
      width: 15px;
      height: 17px;
      border: 4px solid var(--dark);
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 12px 0 0;
      transform-origin: left bottom;
      animation: tailWag .8s ease-in-out var(--delay) infinite alternate;
      z-index: 0;
    }

    /* Variações de cor e tamanho */
    .cat.pink {
      --fur: #e8b5bd; --dark: #87545e;
      --inner-ear: #cf7f91; --cat-scale: .94; --cat-tilt: -4deg;
    }

    .cat.cream {
      --fur: #f5dfae; --dark: #967442;
      --inner-ear: #d8a4a0; --cat-scale: .88; --cat-tilt: 4deg;
    }

    .cat.black {
      --fur: #746965; --dark: #403735;
      --inner-ear: #ad858a; --cat-scale: .96; --cat-tilt: -2deg;
    }

    .cat.black .eye { background: #f5d991; box-shadow: 15px 0 #f5d991; }

    .cat.white {
      --fur: #fff8ed; --dark: #b7a99a;
      --inner-ear: #e4b7b3; --cat-scale: .9; --cat-tilt: 3deg;
    }

    .cat.orange {
      --fur: #e9aa6d; --dark: #9a6137;
      --inner-ear: #d88a80; --cat-scale: 1; --cat-tilt: 2deg;
    }

    .cat.lilac {
      --fur: #d0c0df; --dark: #77618c;
      --inner-ear: #b58dbb; --cat-scale: .9; --cat-tilt: -3deg;
    }

    .cat.gray {
      --fur: #b8b2ac; --dark: #625d59;
      --inner-ear: #d39c9c; --cat-scale: .92; --cat-tilt: 3deg;
    }

    /* Cada gatinho tem um ritmo ligeiramente diferente */
    .cat:nth-child(2n) { --idle-time: 2.7s; --paw-time: .91s; }
    .cat:nth-child(3n) { --idle-time: 1.8s; --paw-time: .63s; }
    .cat:nth-child(4n) { --idle-time: 2.4s; --paw-time: 1.08s; }

    .action-row { margin-top: 24px; }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 12px 19px;
      color: #5d4426;
      background: transparent;
      font: 600 12px Arial, sans-serif;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .action:hover { background: #f5e8cb; transform: translateY(-2px); }

    .footer {
      margin: 26px 0 0;
      color: #9b8875;
      font: 10px Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 7px;
      height: 10px;
      z-index: 10;
      pointer-events: none;
      animation: fall 2.8s linear forwards;
    }

    .hidden { display: none !important; }

    @keyframes giftFloat {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    @keyframes twinkle {
      0%,100% { opacity: .35; transform: scale(.8) rotate(0); }
      50% { opacity: 1; transform: scale(1.2) rotate(25deg); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes catIdle {
      0%,100% {
        transform: translateY(0) rotate(var(--cat-tilt)) scale(var(--cat-scale));
      }
      50% {
        transform: translateY(-5px) rotate(calc(var(--cat-tilt) * -1)) scale(var(--cat-scale));
      }
    }

    @keyframes pawWave {
      0%,100% { transform: rotate(0); }
      45% { transform: rotate(-28deg) translateY(-2px); }
      70% { transform: rotate(12deg); }
    }

    @keyframes tailWag {
      from { transform: rotate(-18deg); }
      to { transform: rotate(18deg); }
    }

    @keyframes catHop {
      0% { transform: translateY(0) scale(var(--cat-scale)); }
      35% { transform: translateY(-17px) scale(var(--cat-scale)); }
      65% { transform: translateY(-13px) scale(var(--cat-scale)); }
      100% { transform: translateY(0) scale(var(--cat-scale)); }
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(650deg); opacity: .1; }
    }

    @media (max-width: 520px) {
      body { padding: 18px 12px calc(24px + env(safe-area-inset-bottom)); }
      .frame { padding: 29px 18px; }
      .gift-stage { min-height: 205px; }
      .cat-cluster { gap: 10px 16px; margin: 17px auto 23px; }
      .cat { flex-basis: 44px; }
      .s1 { left: 8%; }
      .s2 { right: 8%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="frame" id="card" aria-live="polite">
      <p class="eyebrow">Uma pequena surpresa</p>
      <h1>Para Taís<span style="color:var(--gold)">.</span></h1>
      <p class="subtitle" id="intro">
        Tem um presentinho esperando por ti.<br>Abre com carinho. ✦
      </p>

      <div class="gold-line" aria-hidden="true">✧</div>

      <div class="gift-stage" id="giftStage">
        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✧</span>

        <button class="gift-button" id="openGift" aria-label="Abrir o presente">
          <div class="gift" aria-hidden="true">
            <div class="gift-box"></div>
            <div class="gift-lid"><span class="bow"></span></div>
          </div>
        </button>
      </div>

      <p class="hint" id="hint">Toque no presente para abrir</p>

      <section class="message" id="message">
        <h2>Feliz aniversário! ♡</h2>

        <div class="cat-cluster" data-cats="4" aria-label="Gatinhos pixel art"></div>

        <p id="paragraph1"></p>

        <div class="cat-cluster" data-cats="4" aria-label="Gatinhos pixel art"></div>

        <p id="paragraph2"></p>

        <div class="cat-cluster" data-cats="5" aria-label="Gatinhos pixel art"></div>

        <p id="paragraph3"></p>

        <div class="cat-cluster" data-cats="4" aria-label="Gatinhos pixel art"></div>

        <p id="paragraph4"></p>

        <p class="signature" id="signature"></p>

        <div class="action-row">
          <button class="action" id="replay">♡ Ver de novo</button>
        </div>
      </section>

      <p class="footer">Feito especialmente para ti · ✦</p>
    </section>
  </main>

  <script>
    // Personalize a mensagem e a assinatura aqui.
    const birthdayMessage = [
      "Taís, espero que tenha gostado de todos os presentes e agradinhos. Eu amo presentear as pessoas de quem gosto, e escolhi cada um deles pensando em você, cada um com seu motivo.",

      "A botinha pode te ajudar naqueles dias em que não quiser se molhar, e a mochila garante que suas coisas fiquem secas, além de facilitar teu dia. Presentes também podem ser úteis, hehe.",

      "Escolhi o colar e os brincos pensando na cor dos teus olhos e da tua pele. O azul e a prata combinam muito bem com teus olhos e com o significado que eles têm pra mim. Há algo na delicadeza dessas cores que me encanta e me faz querer olhar por mais tempo, assim como acontece quando olho nos teus olhos.",

      "Li em um livro que muitas coisas de que gostamos não são perfeitas, nem precisam ser como gostaríamos que fossem. O pão, quando assado, toma a forma que decidir; os figos, quando maduros, se abrem; e o trigo, quando carregado de grãos, se dobra em direção ao chão.\n\nIsso me ensinou que as coisas podem ser perfeitas exatamente do jeito que são. E acho bonito lembrar disso quando penso em você e no teu jeito de ser."
    ];

    const signatureText = "Com carinho, de alguém que torce por ti.";

    const card = document.getElementById("card");
    const openGift = document.getElementById("openGift");
    const hint = document.getElementById("hint");
    const intro = document.getElementById("intro");
    const replay = document.getElementById("replay");

    let opened = false;

    document.getElementById("paragraph1").textContent = birthdayMessage[0];
    document.getElementById("paragraph2").textContent = birthdayMessage[1];
    document.getElementById("paragraph3").textContent = birthdayMessage[2];
    document.getElementById("paragraph4").textContent = birthdayMessage[3];
    document.getElementById("signature").textContent = signatureText;

    // Arquivos de áudio: deixe os dois na mesma pasta deste index.html.
    // Música de fundo: musica.mp3
    // Som dos gatinhos: meow.mp3
    const backgroundMusic = new Audio("musica.mp3");
    backgroundMusic.loop = true;
    backgroundMusic.preload = "auto";
    backgroundMusic.volume = 0.35;

    const realMeow = new Audio("meow.mp3");
    realMeow.preload = "auto";
    realMeow.volume = 0.55;

    function startMusic() {
      const attempt = backgroundMusic.play();

      if (attempt && typeof attempt.catch === "function") {
        attempt.catch(() => {
          // Alguns navegadores podem bloquear o áudio se o arquivo não existir.
        });
      }
    }

    function meow() {
      try {
        realMeow.pause();
        realMeow.currentTime = 0;

        const attempt = realMeow.play();
        if (attempt && typeof attempt.catch === "function") {
          attempt.catch(() => {});
        }
      } catch (_) {}
    }

    // Cria os gatinhos com corpos, caudas e patinhas animadas.
    const catColors = [
      "pink", "orange", "cream", "black", "white",
      "lilac", "gray", "orange", "pink", "white",
      "cream", "black", "gray", "lilac", "orange",
      "pink", "cream"
    ];

    const clusters = document.querySelectorAll(".cat-cluster");
    let catIndex = 0;

    clusters.forEach(cluster => {
      const count = Number(cluster.dataset.cats);

      for (let i = 0; i < count; i++) {
        const color = catColors[catIndex % catColors.length];
        const cat = document.createElement("button");

        cat.type = "button";
        cat.className = `cat ${color}`;
        cat.setAttribute("aria-label", `Gatinho ${catIndex + 1}`);

        // Tempos e atrasos diferentes para os movimentos não ficarem sincronizados.
        cat.style.setProperty("--delay", `${((catIndex * 0.37) % 1.9).toFixed(2)}s`);
        cat.style.setProperty("--idle-time", `${(1.8 + ((catIndex * 0.29) % 1.3)).toFixed(2)}s`);
        cat.style.setProperty("--paw-time", `${(0.58 + ((catIndex * 0.17) % 0.6)).toFixed(2)}s`);

        cat.innerHTML = `
          <span class="ear left"></span>
          <span class="ear right"></span>
          <span class="head">
            <span class="eye"></span>
            <span class="blush"></span>
            <span class="nose"></span>
            <span class="mouth"></span>
          </span>
          <span class="body"></span>
          <span class="tail"></span>
          <span class="paw left"></span>
          <span class="paw right"></span>
        `;

        cat.addEventListener("click", () => {
          meow();

          // O salto é temporário; depois o gatinho volta à animação normal.
          cat.style.animation = "none";
          void cat.offsetWidth;
          cat.style.animation = "catHop .48s ease-out";
          cat.addEventListener("animationend", () => {
            cat.style.animation = "";
          }, { once: true });
        });

        cluster.appendChild(cat);
        catIndex++;
      }
    });

    function confettiBurst() {
      const colors = [
        "#b58a45", "#e6c989", "#bd7f83",
        "#d9a5a8", "#fff0c9"
      ];

      for (let i = 0; i < 48; i++) {
        const bit = document.createElement("span");
        bit.className = "confetti";
        bit.style.left = Math.random() * 100 + "vw";
        bit.style.background = colors[Math.floor(Math.random() * colors.length)];
        bit.style.animationDelay = Math.random() * .55 + "s";
        bit.style.animationDuration = (2 + Math.random() * 1.6) + "s";
        bit.style.transform = `rotate(${Math.random() * 180}deg)`;

        document.body.appendChild(bit);
        bit.addEventListener("animationend", () => bit.remove(), { once: true });
      }
    }

    function openCard() {
      if (opened) return;

      opened = true;
      card.classList.add("opened");
      intro.classList.add("hidden");
      hint.classList.add("hidden");
      openGift.setAttribute("aria-label", "Presente aberto");

      startMusic();
      confettiBurst();
    }

    function resetCard() {
      opened = false;
      card.classList.remove("opened");
      intro.classList.remove("hidden");
      hint.classList.remove("hidden");
      openGift.setAttribute("aria-label", "Abrir o presente");

      document.querySelectorAll(".confetti").forEach(el => el.remove());

      // A música continua tocando ao voltar à tela inicial.
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    openGift.addEventListener("click", openCard);
    replay.addEventListener("click", resetCard);
  </script>
</body>
</html>
