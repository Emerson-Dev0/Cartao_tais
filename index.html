<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe2">
  <title>Um presente para Taís ✦</title>

  <style>
    :root {
      --cream: #f6efe2;
      --paper: #fffaf0;
      --ink: #30251f;
      --muted: #78675a;
      --gold: #b58a45;
      --rose: #bd7f83;
      --rose-dark: #8f5059;
      --shadow: rgba(63, 43, 28, .16);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 12%, rgba(230,201,137,.25), transparent 32%),
        radial-gradient(ellipse at 88% 82%, rgba(189,127,131,.16), transparent 30%),
        var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .page {
      width: min(100%, 760px);
      position: relative;
      isolation: isolate;
    }

    .frame {
      position: relative;
      padding: clamp(25px, 6vw, 52px);
      border: 1px solid rgba(181,138,69,.72);
      outline: 1px solid rgba(181,138,69,.28);
      outline-offset: 6px;
      background: rgba(255,250,240,.94);
      box-shadow: 0 24px 70px var(--shadow);
      text-align: center;
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "✦";
      position: absolute;
      color: var(--gold);
      font-size: 22px;
      opacity: .8;
      pointer-events: none;
    }

    .frame::before { top: 15px; left: 17px; }
    .frame::after { bottom: 15px; right: 17px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .24em;
      font: 600 10px/1.5 Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: normal;
      line-height: 1.06;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 15px auto 0;
      max-width: 390px;
      color: var(--muted);
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.65;
    }

    .gold-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px auto;
      color: var(--gold);
      font-size: 12px;
    }

    .gold-line::before,
    .gold-line::after {
      content: "";
      width: min(19vw, 72px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .gold-line::after { transform: rotate(180deg); }

    /* PRESENTE */

    .gift-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 230px;
      margin: 5px auto 15px;
      perspective: 800px;
    }

    .gift-button {
      position: relative;
      z-index: 2;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
      transition: transform .25s ease;
    }

    .gift-button:hover {
      transform: translateY(-5px) scale(1.025);
    }

    .gift-button:focus-visible,
    .action:focus-visible,
    .cat:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 5px;
    }

    .gift {
      position: relative;
      width: 142px;
      height: 126px;
      margin-top: 34px;
      filter: drop-shadow(0 12px 8px rgba(67,41,24,.16));
      animation: giftFloat 2.6s ease-in-out infinite;
    }

    .gift-box {
      position: absolute;
      width: 142px;
      height: 90px;
      bottom: 0;
      left: 0;
      border: 2px solid #8e6334;
      background: linear-gradient(135deg, #d6a95d, #b47c39);
      border-radius: 3px;
      overflow: hidden;
    }

    .gift-box::after {
      content: "";
      position: absolute;
      width: 23px;
      height: 100%;
      left: 58px;
      top: 0;
      background: #f6e3ad;
      box-shadow:
        inset 2px 0 rgba(255,255,255,.25),
        inset -2px 0 rgba(119,74,28,.16);
    }

    .gift-lid {
      position: absolute;
      width: 158px;
      height: 27px;
      bottom: 82px;
      left: -8px;
      border: 2px solid #8e6334;
      border-radius: 4px;
      background: linear-gradient(135deg, #e7c47b, #c3914a);
      transform-origin: 12% 100%;
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
      z-index: 2;
    }

    .gift-lid::after {
      content: "";
      position: absolute;
      width: 23px;
      height: 100%;
      left: 66px;
      top: 0;
      background: #fff0c9;
    }

    .bow {
      position: absolute;
      width: 31px;
      height: 22px;
      left: 55px;
      top: -19px;
      z-index: 3;
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 15px;
      border: 4px solid #9c5c60;
      border-radius: 80% 80% 15% 80%;
      top: 0;
    }

    .bow::before {
      left: -7px;
      transform: rotate(25deg);
    }

    .bow::after {
      right: -7px;
      transform: scaleX(-1) rotate(25deg);
    }

    .sparkle {
      position: absolute;
      color: var(--gold);
      font-size: 22px;
      pointer-events: none;
      animation: twinkle 1.7s ease-in-out infinite;
    }

    .s1 { left: 15%; top: 23%; }
    .s2 { right: 16%; top: 14%; animation-delay: .7s; }
    .s3 { right: 20%; bottom: 14%; animation-delay: 1.2s; font-size: 15px; }
    .s4 { left: 20%; bottom: 17%; animation-delay: .35s; font-size: 16px; }

    .hint {
      margin: 0;
      color: var(--muted);
      font: 11px Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .opened .gift-button { cursor: default; }
    .opened .gift { animation: none; }

    .opened .gift-lid {
      transform: rotate(-125deg) translate(-10px, -13px);
    }

    .opened .gift-button:hover { transform: none; }

    /* MENSAGEM */

    .message {
      display: none;
      width: 100%;
      margin: 26px auto 0;
      animation: reveal .8s both;
    }

    .opened .message { display: block; }

    .message h2 {
      font-weight: normal;
      font-size: clamp(1.7rem, 6vw, 2.7rem);
      color: var(--rose-dark);
      margin: 0 0 20px;
    }

    /*
      Os gatos ficam em duas colunas laterais.
      O texto fica isolado no centro, sem gatos entre os parágrafos.
    */

    .message-layout {
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr) 43px;
      align-items: stretch;
      gap: clamp(7px, 2vw, 16px);
      width: 100%;
      text-align: left;
    }

    .message-copy {
      min-width: 0;
    }

    .message-copy p {
      color: #5d4b40;
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.9;
      margin: 0 0 22px;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    .message-copy p:last-child { margin-bottom: 0; }

    .signature {
      color: var(--gold) !important;
      font-style: italic;
      text-align: center;
      margin-top: 25px !important;
    }

    /* GATINHOS PIXEL ART */

    .cat-rail {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      min-width: 0;
      gap: 28px;
      padding: 12px 0;
    }

    .cat {
      --fur: #e9aa6d;
      --dark: #925d3b;
      --inner: #d58e91;
      --size: 32px;

      position: relative;
      display: block;
      flex: 0 0 var(--size);
      width: var(--size);
      height: calc(var(--size) + 13px);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      image-rendering: pixelated;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transform-origin: center bottom;
      animation: catIdle 3.1s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .cat:hover {
      z-index: 2;
      filter: brightness(1.08) drop-shadow(0 3px 2px rgba(63,43,28,.2));
    }

    /* Orelhas curtas e triangulares: silhueta de gato */

    .cat .ear {
      position: absolute;
      top: 1px;
      width: 10px;
      height: 11px;
      background: var(--fur);
      border: 2px solid var(--dark);
      z-index: 0;
    }

    .cat .ear.left {
      left: 3px;
      clip-path: polygon(0 0,100% 35%,100% 100%,0 100%);
    }

    .cat .ear.right {
      right: 3px;
      clip-path: polygon(0 35%,100% 0,100% 100%,0 100%);
    }

    .cat .ear::after {
      content: "";
      position: absolute;
      inset: 3px 2px 1px;
      background: var(--inner);
    }

    /* Cabeça */

    .cat .face {
      position: absolute;
      top: 8px;
      left: 2px;
      width: calc(var(--size) - 4px);
      height: calc(var(--size) - 13px);
      background: var(--fur);
      border: 2px solid var(--dark);
      border-radius: 2px;
      z-index: 2;
      box-shadow: inset 0 -3px rgba(0,0,0,.04);
    }

    .cat .eye {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 5px;
      background: #30251f;
    }

    .cat .eye.left { left: 5px; }
    .cat .eye.right { right: 5px; }

    .cat.black .eye { background: #f5d991; }

    .cat .muzzle {
      position: absolute;
      left: 50%;
      bottom: 3px;
      width: 4px;
      height: 3px;
      transform: translateX(-50%);
      background: #a65c69;
      clip-path: polygon(0 0,100% 0,50% 100%);
    }

    /* Corpo visível, não apenas uma cabeça flutuante */

    .cat .body {
      position: absolute;
      width: 19px;
      height: 12px;
      left: 50%;
      bottom: 2px;
      transform: translateX(-50%);
      background: var(--fur);
      border: 2px solid var(--dark);
      z-index: 1;
    }

    /* Quatro patinhas pequenas e separadas */

    .cat .paw {
      position: absolute;
      bottom: 0;
      width: 5px;
      height: 6px;
      background: var(--fur);
      border-bottom: 2px solid var(--dark);
      z-index: 3;
    }

    .cat .paw.p1 { left: 5px; }
    .cat .paw.p2 { left: 11px; }
    .cat .paw.p3 { right: 11px; }
    .cat .paw.p4 { right: 5px; }

    /* Rabinho saindo de trás do corpo */

    .cat .tail {
      position: absolute;
      right: -1px;
      bottom: 7px;
      width: 10px;
      height: 12px;
      border: 3px solid var(--dark);
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 7px 0 0;
      transform-origin: left bottom;
      transform: rotate(-8deg);
      z-index: 0;
      animation: tailWag 1.8s ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    /* Variação de pelagem */

    .cat.pink {
      --fur: #e8b5bd;
      --dark: #87545e;
      --inner: #cf7f91;
    }

    .cat.cream {
      --fur: #f5dfae;
      --dark: #967442;
      --inner: #d8a4a0;
    }

    .cat.black {
      --fur: #746965;
      --dark: #403735;
      --inner: #ad858a;
    }

    .cat.white {
      --fur: #fff8ed;
      --dark: #a99a8a;
      --inner: #e4b7b3;
    }

    .cat.orange {
      --fur: #e9aa6d;
      --dark: #9a6137;
      --inner: #d88a80;
    }

    .cat.lilac {
      --fur: #d0c0df;
      --dark: #77618c;
      --inner: #b58dbb;
    }

    .cat.gray {
      --fur: #b8b2ac;
      --dark: #625d59;
      --inner: #d39c9c;
    }

    /* Cada gatinho tem um ritmo e uma pausa próprios */

    .cat:nth-child(1) { --delay: -.4s; }
    .cat:nth-child(2) { --delay: -1.7s; }
    .cat:nth-child(3) { --delay: -.9s; }
    .cat:nth-child(4) { --delay: -2.3s; }
    .cat:nth-child(5) { --delay: -.2s; }
    .cat:nth-child(6) { --delay: -1.2s; }
    .cat:nth-child(7) { --delay: -2.7s; }
    .cat:nth-child(8) { --delay: -.7s; }

    .cat:nth-child(2n) {
      animation-duration: 3.8s;
    }

    .cat:nth-child(3n) {
      animation-duration: 2.7s;
    }

    .cat:nth-child(4n) .tail {
      animation-duration: 2.6s;
    }

    .cat:nth-child(3n) .tail {
      animation-duration: 1.3s;
    }

    .cat:nth-child(5n) .tail {
      animation-direction: alternate-reverse;
    }

    .cat:active {
      animation-play-state: paused;
    }

    /* BOTÕES E RODAPÉ */

    .action-row { margin-top: 28px; }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 12px 19px;
      color: #5d4426;
      background: transparent;
      font: 600 12px Arial, sans-serif;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .action:hover {
      background: #f5e8cb;
      transform: translateY(-2px);
    }

    .footer {
      margin: 26px 0 0;
      color: #9b8875;
      font: 10px Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 7px;
      height: 10px;
      z-index: 10;
      pointer-events: none;
      animation: fall 2.8s linear forwards;
    }

    .hidden { display: none !important; }

    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.8) rotate(0); }
      50% { opacity: 1; transform: scale(1.2) rotate(25deg); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes catIdle {
      0%, 100% { translate: 0 0; }
      35% { translate: 0 -2px; }
      42% { translate: 0 -2px; }
      55% { translate: 0 0; }
    }

    @keyframes tailWag {
      from { rotate: -15deg; }
      to { rotate: 22deg; }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(650deg);
        opacity: .1;
      }
    }

    @media (max-width: 520px) {
      body { padding: 18px 12px; }

      .frame { padding: 30px 13px; }

      .gift-stage { min-height: 205px; }

      .s1 { left: 8%; }
      .s2 { right: 8%; }

      .message-layout {
        grid-template-columns: 25px minmax(0, 1fr) 25px;
        gap: 5px;
      }

      .cat-rail {
        gap: 22px;
        padding: 8px 0;
      }

      .cat {
        --size: 23px;
        height: 31px;
      }

      .cat .ear {
        width: 8px;
        height: 9px;
        border-width: 1.5px;
      }

      .cat .face {
        top: 7px;
        left: 1px;
        width: calc(var(--size) - 2px);
        height: 15px;
        border-width: 1.5px;
      }

      .cat .eye {
        top: 4px;
        width: 2px;
        height: 4px;
      }

      .cat .eye.left { left: 3px; }
      .cat .eye.right { right: 3px; }

      .cat .body {
        width: 15px;
        height: 9px;
        border-width: 1.5px;
      }

      .cat .paw {
        width: 4px;
        height: 5px;
        border-bottom-width: 1.5px;
      }

      .cat .paw.p1 { left: 3px; }
      .cat .paw.p2 { left: 7px; }
      .cat .paw.p3 { right: 7px; }
      .cat .paw.p4 { right: 3px; }

      .cat .tail {
        right: -3px;
        bottom: 5px;
        width: 8px;
        height: 9px;
        border-width: 2px;
        border-left: 0;
        border-bottom: 0;
      }

      .message-copy p {
        font-size: 15px;
        line-height: 1.8;
        margin-bottom: 19px;
      }

      .message h2 {
        font-size: clamp(1.6rem, 7vw, 2.2rem);
      }
    }

    @media (max-width: 350px) {
      .frame { padding-inline: 10px; }

      .message-layout {
        grid-template-columns: 20px minmax(0, 1fr) 20px;
        gap: 3px;
      }

      .cat { --size: 19px; }
      .message-copy p { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="frame" id="card" aria-live="polite">

      <p class="eyebrow">Uma pequena surpresa</p>

      <h1>Para Taís<span style="color:var(--gold)">.</span></h1>

      <p class="subtitle" id="intro">
        Tem um presentinho esperando por ti.<br>
        Abre com carinho. ✦
      </p>

      <div class="gold-line" aria-hidden="true">✧</div>

      <div class="gift-stage">
        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✧</span>

        <button class="gift-button" id="openGift" aria-label="Abrir o presente">
          <div class="gift" aria-hidden="true">
            <div class="gift-box"></div>
            <div class="gift-lid"><span class="bow"></span></div>
          </div>
        </button>
      </div>

      <p class="hint" id="hint">Toque no presente para abrir</p>

      <section class="message" id="message" aria-label="Mensagem de aniversário">

        <h2>Feliz aniversário! ♡</h2>

        <div class="message-layout">

          <!-- GATINHOS DA LATERAL ESQUERDA -->
          <div class="cat-rail cats-left" aria-label="Gatinhos decorativos">

            <button class="cat pink" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span>
              <span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat orange" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat black" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat cream" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat lilac" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat white" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat gray" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

            <button class="cat orange" aria-label="Fazer gatinho miar">
              <span class="ear left"></span><span class="ear right"></span>
              <span class="tail"></span><span class="body"></span>
              <span class="paw p1"></span><span class="paw p2"></span>
              <span class="paw p3"></span><span class="paw p4"></span>
              <span class="face"><i class="eye left"></i><i class="eye right"></i><i class="muzzle"></i></span>
            </button>

          </div>

          <!-- TEXTO CENTRAL: SEM GATOS ENTRE OS PARÁGRAFOS -->

  <script>
    // MENSAGEM E ASSINATURA

    const birthdayMessage = `Taís, espero que tenha gostado de todos os presentes e agradinhos. Eu amo presentear as pessoas de quem gosto, e escolhi cada um deles pensando em você, cada um com seu motivo.

A botinha pode te ajudar naqueles dias em que não quiser se molhar, e a mochila garante que suas coisas fiquem secas, além de facilitar teu dia. Presentes também podem ser úteis, hehe.

Escolhi o colar e os brincos pensando na cor dos teus olhos e da tua pele. O azul e a prata combinam muito bem com teus olhos e com o significado que eles têm pra mim. A delicadeza dessas cores me encanta e me faz querer olhar por mais tempo, assim como acontece quando olho para os teus olhos.

Li em um livro que muitas coisas de que gostamos não são perfeitas, nem precisam ser como gostaríamos que fossem. O pão, quando assado, toma a forma que decidir; os figos, quando maduros, se abrem; e o trigo, quando carregado de grãos, se dobra em direção ao chão.

Isso me ensinou que as coisas podem ser perfeitas exatamente do jeito que são. E acho bonito lembrar disso quando penso em você e no teu jeito de ser.`;

    const signatureText = "Com carinho, de alguém que torce por ti.";

    document.getElementById("personalMessage").textContent = birthdayMessage;
    document.getElementById("signature").textContent = signatureText;

    const card = document.getElementById("card");
    const openGift = document.getElementById("openGift");
    const hint = document.getElementById("hint");
    const intro = document.getElementById("intro");
    const replay = document.getElementById("replay");

    let opened = false;

    // MÚSICA DO CARTÃO
    // Coloque o arquivo musica.mp3 na mesma pasta do index.html.
    const music = new Audio("musica.mp3");
    music.loop = true;
    music.preload = "auto";
    music.volume = 0.4;

    function playMusic() {
      music.play().catch(() => {
        // Alguns navegadores podem bloquear a reprodução.
        // O clique no presente normalmente autoriza o áudio.
      });
    }

    function stopMusic() {
      music.pause();
      music.currentTime = 0;
    }

    // EFEITO DE CONFETE

    function confettiBurst() {
      const colors = [
        "#b58a45",
        "#e6c989",
        "#bd7f83",
        "#d9a5a8",
        "#fff0c9"
      ];

      for (let i = 0; i < 48; i++) {
        const bit = document.createElement("span");

        bit.className = "confetti";
        bit.style.left = Math.random() * 100 + "vw";
        bit.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        bit.style.animationDelay = Math.random() * .55 + "s";
        bit.style.animationDuration = (2 + Math.random() * 1.6) + "s";
        bit.style.transform = `rotate(${Math.random() * 180}deg)`;

        document.body.appendChild(bit);

        bit.addEventListener("animationend", () => bit.remove(), {
          once: true
        });
      }
    }

    // ABRIR PRESENTE

    function openCard() {
      if (opened) return;

      opened = true;

      card.classList.add("opened");
      intro.classList.add("hidden");
      hint.classList.add("hidden");

      openGift.setAttribute("aria-label", "Presente aberto");

      playMusic();
      confettiBurst();
    }

    // VOLTAR AO INÍCIO

    function resetCard() {
      opened = false;

      card.classList.remove("opened");
      intro.classList.remove("hidden");
      hint.classList.remove("hidden");

      openGift.setAttribute("aria-label", "Abrir o presente");

      document.querySelectorAll(".confetti").forEach(el => el.remove());

      stopMusic();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // SOM DOS GATINHOS
    // Opcional: coloque meow.mp3 na mesma pasta do HTML.

    const realMeow = new Audio("meow.mp3");
    realMeow.preload = "auto";
    realMeow.volume = 0.45;

    function meow() {
      try {
        realMeow.pause();
        realMeow.currentTime = 0;

        const attempt = realMeow.play();

        if (attempt && typeof attempt.catch === "function") {
          attempt.catch(() => {});
        }
      } catch (_) {}
    }

    // CADA GATINHO TEM SEU PRÓPRIO PULO

    document.querySelectorAll(".cat").forEach((cat, index) => {
      cat.addEventListener("click", () => {
        meow();

        // Pequenas diferenças deixam a animação menos sincronizada.
        const height = 9 + (index % 4) * 3;
        const duration = 350 + (index % 3) * 90;

        cat.animate([
          { translate: "0 0" },
          { translate: `0 -${height}px` },
          { translate: "0 0" }
        ], {
          duration,
          easing: "cubic-bezier(.2,.8,.3,1)"
        });
      });
    });

    openGift.addEventListener("click", openCard);
    replay.addEventListener("click", resetCard);
  </script>
